[project]
name = "d4d"
version = "0.1.0"
description = "Design for Descent: grammar-guided hybrid discrete/continuous optimization"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "CC-BY-NC-4.0" }
dependencies = [
    "torch>=2.4",
    "typing_extensions>=4.4",
]

[project.optional-dependencies]
progress = ["tqdm>=4.65"]
video = ["imageio>=2.31", "imageio-ffmpeg>=0.4"]
dev = ["pytest>=7.4", "pyright>=1.1.350", "ruff>=0.4", "numpy>=1.24"]

[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["d4d*"]

[tool.setuptools.package-data]
d4d = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.pyright]
include = ["src/d4d"]
pythonVersion = "3.11"
typeCheckingMode = "standard"
reportMissingImports = "error"
reportMissingTypeStubs = "none"
reportUnusedImport = "error"
reportUnusedVariable = "error"
reportIncompatibleMethodOverride = "error"
reportIncompatibleVariableOverride = "error"
reportUntypedFunctionDecorator = "error"
reportInvalidTypeVarUse = "error"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# __all__ is grouped by role (core / callbacks / utils) with comments, which
# reads better than alphabetical for this module.
ignore = ["RUF022"]
